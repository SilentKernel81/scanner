# ============================================================================
# Card Scanner Configuration
# ============================================================================

# Camera Settings
camera:
  # A camera station's camera (station_client.py; the server has none): 'auto' - a USB camera
  # if there is one, else a Raspberry Pi camera - or 'usb' / 'picamera'. Also SCANNER_CAMERA,
  # and the station's setup page. 'remote': this machine has no camera - scripts/start.sh and
  # scripts/deploy.sh then start and install only the server
  type: auto
  # auto: the first USB camera that is not a laptop's own. Or /dev/videoN's number (check with
  # v4l2-ctl --list-devices); the station's setup page and SCANNER_CAMERA_INDEX choose another
  usb_index: auto
  resolution: [2560, 1440]
  preview_resolution: [640, 480]
  fps: 20
  # Rotate the image (degrees clockwise: 0, 90, 180, 270) - e.g. a camera mounted sideways so a
  # card's long side runs along the frame's long side: more pixels per card and more room for
  # the pile to grow. Also settable in Settings (saved in data/settings.json)
  rotate: 0
  # Use just this part of the camera's picture (fractions of the full image: x1, y1, x2, y2) -
  # e.g. the box under a wide lens. A Raspberry Pi camera module reads out only that part of its
  # sensor, pixel for pixel; a USB camera sends its whole picture and the station cuts it. Both
  # then give the same kind of picture. Without it the whole image is used (a Pi camera
  # scales it to `resolution`). Normally drawn on the station's setup page (port 8080)
  # crop: [0.33, 0.08, 0.67, 0.75]

# Detection Settings
detection:
  # The card is found by its outline (fast, tight, perspective-corrected crop)
  allow_landscape: false  # Accept sideways cards. Off: a card's art box can look like a sideways card
  # Our own corner network (a 3 MB file in the station's folder) is asked first, for the cards the
  # outline detector loses on a tall pile of sleeved cards; the outline detector answers when it
  # is unsure. auto: use it when its file loads. off: the outline detector alone (also
  # SCANNER_NEURAL_DETECTOR=off in the environment)
  neural: auto

# Auto-capture Settings (now controlled via UI button)
auto_capture:
  delay: 1.0  # Minimum seconds between auto-captures (the next capture also waits until the card is swapped)
  stability_frames: 5  # Consecutive still, in-focus frames required for normal mode
  min_sharpness: 250  # Don't auto-capture below this sharpness (blurry / still focusing); lower it if cards never become "Ready"
  max_movement: 0.015  # A card is still when its corners move less than this fraction of its size per frame and over the streak (0.01 = 1%; lower it if a sliding card is captured, raise it if cards wait with "movement 1-2%")
  # With a locked focus: every this many captures, compare the focus one step away in the
  # gap before the next drop (~1 s) and keep the sharper one - the best position drifts as
  # the pile grows and the lens warms up. 0 = never. Each check holds the next card back
  # about a second; the position moves about one step in 10+ minutes. Also in Settings
  # (saved in data/settings.json, which then wins)
  refocus_every: 10
  # With a locked focus: when the last 3 captured cards were all sharper than this fraction of
  # the median of the cards before them (and that median was not a soft one, >= 600), the
  # station finds the sharpest focus again (~8 s) instead of scanning on blurred. At most
  # once a minute. 0 = never.
  refocus_on_drop: 0.35

# Fast Scan Mode Settings
fast_scan:
  stability_frames: 6  # Consecutive still frames when adding automatically (~0.3 s) - with the drift check, a sleeved card sliding >= ~1.3 px/frame is no longer captured mid-slide (4 frames still let slow slides through)

# Vision AI Settings
vision_ai:
  enabled: true
  provider: gemini  # Options: 'gemini', 'openai', 'anthropic', 'local'
  # Check the foil marker (★ = foil, • = non-foil) next to the set code - one extra small
  # AI request per card, only for captures found by outline detection
  detect_foil: true
  # Longest side (px) of the card image sent for identification. 1024 was as accurate as
  # 2048 and ~35% faster with qwen3.5 (fewer image tokens); 768 lost accuracy
  image_size: 1024
  # Cards the vision AI works on at the same time (those OCR could not confirm). More only
  # helps as far as the provider answers requests in parallel (Ollama: OLLAMA_NUM_PARALLEL)
  workers: 3

  # API keys are read from environment variables (GEMINI_API_KEY, OPENAI_API_KEY,
  # ANTHROPIC_API_KEY) - put them in .env (see .env.example)

  # Local AI Settings (self-hosted models)
  local:
    # Ollama on this machine. Elsewhere: Settings -> Vision AI, or LOCAL_AI_ENDPOINT
    # (the Docker image sets it to host.docker.internal)
    endpoint: http://localhost:11434/v1/chat/completions
    model: qwen3.5:9b  # default until a model is chosen in Settings

# Stations: phones / computers with a camera that capture cards and send them here
stations:
  # When set, a station must send this token with each capture (header X-Station-Token).
  # Also from the environment: SCANNER_STATION_TOKEN
  token: ""

# Flask Settings
flask:
  # auto: the whole network (0.0.0.0; there is no login), but this computer only (127.0.0.1) when
  # started as a desktop program (the AppImage, --app). Or an address to listen on. The switch
  # "Reachable from other devices" in Settings overrides this
  host: auto
  port: 5000
  # Names the pages and stations may reach the server under, besides localhost, IP addresses
  # and this computer's own name (alone or with .local, .lan, .home, .home.arpa, .internal,
  # .localdomain) - e.g. behind a reverse proxy or a Docker service name: [cards.example.org]
  allowed_hosts: []
  debug: false
  # secret_key: signs Flask's cookies; by default a random one is made in data/secret_key

# API URLs
api:
  scryfall_bulk: https://api.scryfall.com/bulk-data/default-cards

# Database
database:
  file: cards_database.db
  # At startup (and once a day) the app checks whether newer card data is available and
  # shows a notice. Scryfall republishes its data every day (prices), so Magic only counts
  # as outdated once the local copy is this many days older than Scryfall's
  update_after_days: 7

# light-ocr (offline text recognition) reads each card before the vision AI, which is then
# asked only when OCR's read isn't a confirmed match. Needs Node.js 22+ and `npm install` in
# ocr/ (scripts/deploy.sh does it); switched on/off in Settings
ocr:
  provider: auto  # auto (GPU through WebGPU/Vulkan when available, else CPU), cpu, webgpu
  # Read the foil marker (★ foil, • regular) of a card OCR confirmed but could not read the
  # marker of, with a small network on the set line (core/foil_marker.py) - before the AI's
  # foil check is asked. One more small OCR request for the cards that need it: the whole read
  # took 170 ms (median) measured while the GPU was busy training; the strip's OCR alone took
  # 46-85 ms in the experiment; a quiet server's whole read was not measured
  foil_marker: true

# Printing check (core/printing_check.py): does the picture look like the printing the server just
# resolved? A Secret Lair card prints the set and number of the card it is made from, and the AI
# sometimes names a card the picture is not. shadow: written down in data/logs/printing_check.jsonl
# (python scripts/printing_check_report.py sums it up), nothing is changed; off. It needs an image
# index of Scryfall's pictures: Settings > Card reading > Picture, or python scripts/build_image_index.py (about 15 MB; the first build downloads about 12 GB
# and takes hours, later ones only the new printings); without one it does nothing
printing_check:
  mode: shadow
  # The lookup: also work out what the picture and the strip alone would have answered - the answer
  # that could replace the vision AI's - and write it beside what the AI answered, to compare on live
  # scans before anything is switched off. ai_cases: only for cards the AI read or nothing read (about
  # 3% of the captures); all: every capture, the OCR-confirmed too, at one more small OCR request each;
  # off. Still log-only: nothing is added, changed or sent to review by it
  lookup: ai_cases

# How a card is read (core/identification.py; docs/plans/READING_REFACTOR_PLAN.md, phase 3).
# The vision AI came first because OCR did not read well enough; light-ocr does now, and the picture of a card can be matched against every printing,
# so the AI is the LAST step, kept until it can be removed:
#   evidence (the default): the PICTURE first (a fingerprint matched against every printing - needs the image index: Settings > Card reading > Picture -
#            with the collector line read from its strip when OCR is on); a card it settles is settled. In doubt, light-ocr reads the whole card (when OCR is on);
#            only what is still open is asked of the vision AI (when it is on), and the AI's answer is checked against the picture; else it goes to review.
#            OCR and AI both off: the picture alone, then review. Without an index it is the cascade.
#   cascade: OCR, then the vision AI for what OCR cannot confirm - the reading as it was before the picture matching existed
# The person's choice wins over this default and needs no rebuild and no restart: Settings > Card reading (guarded by the settings password when there is one),
# remembered in data/settings.json as "reading_mode", "reading_accept_image_alone" and "reading_extend_index"
reading:
  mode: evidence
  # Add a card when only the picture decided it (the strip did not name a printing the picture agrees with, or there is no strip: OCR off). ON by default since
  # 2026-10-20: the picture comes first and a clear one settles the card. Guarded (the best match must be 0.5 similar and 0.05 clear of the next, and the strip, when
  # read, must not name a printing the image index lacks) and none wrong on 1,628 evaluation pictures. It adds nothing while the index lacks any printing of the card
  # data (after a card data update, until the index is extended: Settings > Card reading > Picture) - a printing the index lacks would otherwise be added as its
  # best match, another printing (4% of the simulated missing printings with no readable strip). Left open: a card newer than the card data itself. OFF: such a
  # card needs the collector line or OCR to agree, else it goes on to the AI or review.
  accept_image_alone: true
  # After a card data download that succeeded, extend the picture index by the new printings' pictures (a few seconds for a handful, from Scryfall), so the picture alone
  # is not held back for long (see accept_image_alone). Only when an index exists already - the first build (hours, ~12 GB) is only ever started by the button in
  # Settings > Card reading > Picture. Remembered per person in data/settings.json as "reading_extend_index".
  extend_index_after_update: true

# Cleanup Settings
cleanup:
  enabled: true
  days: 7  # Delete scanned images older than this many days
