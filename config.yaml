# ============================================================================
# Card Scanner Configuration
# ============================================================================

# Camera Settings
camera:
  type: auto  # Options: 'auto', 'picamera', 'usb'
  # USB camera: auto (the first one that is not a laptop's own), or N for /dev/videoN.
  # Choosing a camera in Settings overrides this
  usb_index: auto
  resolution: [2560, 1440]
  preview_resolution: [640, 480]
  fps: 20
  # Rotate the image (degrees clockwise: 0, 90, 180, 270) - e.g. a camera mounted sideways so a
  # card's long side runs along the frame's long side: more pixels per card and more room for
  # the pile to grow. Also settable in Settings (saved in data/settings.json)
  rotate: 0

# Detection Settings
detection:
  # The card is found by its outline (fast, tight, perspective-corrected crop)
  allow_landscape: false  # Accept sideways cards. Off: a card's art box can look like a sideways card

# Auto-capture Settings (now controlled via UI button)
auto_capture:
  delay: 1.0  # Minimum seconds between auto-captures (the next capture also waits until the card is swapped)
  stability_frames: 5  # Consecutive still, in-focus frames required for normal mode
  min_sharpness: 250  # Don't auto-capture below this sharpness (blurry / still focusing); lower it if cards never become "Ready"
  # With a locked focus: every this many captures, compare the focus one step away in the
  # gap before the next drop (~1 s) and keep the sharper one - the best position drifts as
  # the pile grows and the lens warms up. 0 = never. Each check holds the next card back
  # about a second; the position moves about one step in 10+ minutes. Also in Settings
  # (saved in data/settings.json, which then wins)
  refocus_every: 10

# Fast Scan Mode Settings
fast_scan:
  stability_frames: 6  # Consecutive still frames when adding automatically (~0.3 s) - with the drift check, a sleeved card sliding >= ~1.3 px/frame is no longer captured mid-slide (4 frames still let slow slides through)

# Vision AI Settings
vision_ai:
  enabled: true
  provider: gemini  # Options: 'gemini', 'openai', 'anthropic', 'local'
  # Check the foil marker (★ = foil, • = non-foil) next to the set code - one extra small
  # AI request per card, only for captures found by outline detection
  detect_foil: true
  # Longest side (px) of the card image sent for identification. 1024 was as accurate as
  # 2048 and ~35% faster with qwen3.5 (fewer image tokens); 768 lost accuracy
  image_size: 1024

  # API keys are read from environment variables (GEMINI_API_KEY, OPENAI_API_KEY,
  # ANTHROPIC_API_KEY) - put them in .env (see .env.example)

  # Local AI Settings (self-hosted models)
  local:
    endpoint: http://localhost:11434/v1/chat/completions  # or enter it in Settings -> Vision AI
    model: qwen3.5:9b  # default until a model is chosen in Settings

# Flask Settings
flask:
  # auto: the whole network (0.0.0.0; there is no login), but this computer only (127.0.0.1)
  # when started as a desktop program (the AppImage, --app). Or an address to listen on.
  # The switch in Settings overrides this
  host: auto
  port: 5000
  # Names the pages may be opened under, besides localhost, IP addresses and this computer's
  # own name (alone or with .local, .lan, .home, .home.arpa, .internal, .localdomain) -
  # e.g. behind a reverse proxy: [cards.example.org]
  allowed_hosts: []
  debug: false
  # secret_key: signs Flask's cookies; by default a random one is made in data/secret_key

# API URLs
api:
  scryfall_bulk: https://api.scryfall.com/bulk-data/default-cards

# Database
database:
  file: cards_database.db
  # At startup (and once a day) the app checks whether newer card data is available and
  # shows a notice. Scryfall republishes its data every day (prices), so Magic only counts
  # as outdated once the local copy is this many days older than Scryfall's
  update_after_days: 7

# light-ocr (offline text recognition) reads each card before the vision AI, which is then
# asked only when OCR's read isn't a confirmed match. Needs Node.js 22+ and `npm install` in
# ocr/ (scripts/deploy.sh does it); switched on/off in Settings
ocr:
  provider: auto  # auto (GPU through WebGPU/Vulkan when available, else CPU), cpu, webgpu

# Cleanup Settings
cleanup:
  enabled: true
  days: 7  # Delete scanned images older than this many days
