{# The dialog that asks for one value - a location, a tag, a deck (library.js: valueDialog).
   On the collection page and on the deck pages. #}
    <!-- One value for a bulk action (location, tag, condition, deck) -->
    <div id="value-modal" class="modal">
        <div class="modal-content narrow">
            <div class="modal-header">
                <h2 id="value-title"></h2>
                <span class="close" onclick="closeValueDialog(null)">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="value-input" id="value-label"></label>
                    <div class="value-field">
                        <input type="text" id="value-input" maxlength="60" autocomplete="off">
                        <button type="button" id="value-toggle" class="value-toggle" tabindex="-1" aria-label="Show the choices" hidden>&#9662;</button>
                        <div id="value-suggest" class="value-suggest" hidden></div>
                    </div>
                    <select id="value-select" hidden></select>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-primary" id="value-ok">OK</button>
                    <button class="btn" onclick="closeValueDialog(null)">Cancel</button>
                </div>
            </div>
        </div>
    </div>
