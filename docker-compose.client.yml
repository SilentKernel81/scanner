# Camera station: the camera's side of the scanner, on the machine the camera is plugged into.
#   docker compose -f docker-compose.client.yml up -d --build
# then open the station's setup page, http://<this machine>:8080, and choose the server, the
# station's name and the camera. What is saved there is kept in the volume "station-data".
#
# A Raspberry Pi camera module needs the second file as well:
#   docker compose -f docker-compose.client.yml -f docker-compose.client-pi.yml up -d --build
#
# The same things can be fixed here instead, in the environment or in .env beside this file -
# a value given this way wins, and the setup page shows it as fixed:
#   SCANNER_SERVER         the scanner server, e.g. http://192.168.1.20:5000
#   SCANNER_CAMERA_INDEX   the camera: N of /dev/videoN, or its /dev/v4l/by-id/... path - that one stays
#                          the same camera when the numbers change (default: camera.usb_index in config.yaml)
#   SCANNER_CAMERA         auto (default) / usb / picamera
#   SCANNER_STATION_ID     default: this machine's name;  SCANNER_STATION_NAME: shown on the server
#   SCANNER_STATION_TOKEN  when the server has a station token
#   SCANNER_SETUP_PORT     the setup page's port on this machine (default 8080)
#   SCANNER_SETUP_PASSWORD the setup page's password (default: chosen on the page at its first visit)
services:
  station:
    build:
      context: .
      target: client
    image: mtg-scanner-station
    container_name: mtg-scanner-station
    init: true
    stop_signal: SIGINT  # like Ctrl+C: the camera is released
    restart: unless-stopped
    environment:
      SCANNER_SERVER: ${SCANNER_SERVER:-}
      SCANNER_CAMERA: ${SCANNER_CAMERA:-}
      SCANNER_CAMERA_INDEX: ${SCANNER_CAMERA_INDEX:-}
      SCANNER_STATION_ID: ${SCANNER_STATION_ID:-}
      SCANNER_STATION_NAME: ${SCANNER_STATION_NAME:-}
      SCANNER_STATION_TOKEN: ${SCANNER_STATION_TOKEN:-}
      SCANNER_SETUP_PASSWORD: ${SCANNER_SETUP_PASSWORD:-}
    ports:
      - "${SCANNER_SETUP_PORT:-8080}:8080"  # the setup page
    volumes:
      # The host's /dev with access to video devices only (major 81): a camera unplugged and
      # plugged in again is found again, which a fixed "devices:" entry would not be
      - /dev:/dev
      - /etc/hostname:/etc/host_hostname:ro  # the default station id
      - /etc/localtime:/etc/localtime:ro
      # What the setup page saved (station.json), and the debug trace's frames
      - station-data:/app/data
      # Captured cards that are not on the server yet (pictures and their notes): kept when
      # the container is replaced by a new image, and sent by the new one
      - station-captures:/app/scanned_cards
    device_cgroup_rules:
      - "c 81:* rmw"

volumes:
  station-data:
  station-captures:
