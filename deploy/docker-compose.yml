# Card scanner server: the web app, card data, OCR reader and AI requests.
#   mkdir -p data scanned_cards      # before the first start, so they belong to you, not root
#   docker compose up -d --build     # in the top folder: its compose.yaml includes this file
# With an NVIDIA GPU for the OCR reader:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml up -d --build
# Settings come from .env in the top folder (see .env.example). Docker Compose looks for that
# file beside the compose file it is given, which is why deploy/.env is a link to it.
#
# Paths in this file are written from this folder (deploy/): "../data" is data/ in the
# project's top folder. Docker reads them that way whatever folder the command is run from.
# `name` keeps the project's name - and with it the names of its volumes and its network -
# what it was when these files lay in the top folder of a checkout called scanner-server.
name: scanner-server

services:
  server:
    build:
      context: ..                    # the project's top folder: the image is built from its files
      dockerfile: deploy/Dockerfile
      target: server
    image: mtg-scanner-server
    container_name: mtg-scanner-server
    init: true
    stop_signal: SIGINT  # like Ctrl+C: the app closes its databases
    restart: unless-stopped
    user: "${SCANNER_UID:-1000}:${SCANNER_GID:-1000}"  # the owner of data/ and scanned_cards/
    ports:
      # SCANNER_BIND (in .env) limits which address of this machine the port is published on:
      # 127.0.0.1 for a server only this computer uses, a LAN address for one network card.
      # Unset, the port is published on every address, as before (stations, the phone and the
      # other computers reach it - that is the point of the server).
      - "${SCANNER_BIND:+${SCANNER_BIND}:}${SCANNER_PORT:-5000}:5000"
    volumes:
      - ../data:/app/data                   # collection, scanned cards, settings, keys, backups, logs
      - ../scanned_cards:/app/scanned_cards # captured card images
      - /etc/localtime:/etc/localtime:ro    # log times and the daily backup follow the host's clock
    environment:
      # Ollama on the machine running Docker (must listen on more than 127.0.0.1)
      LOCAL_AI_ENDPOINT: ${LOCAL_AI_ENDPOINT:-http://host.docker.internal:11434/v1/chat/completions}
    env_file:
      - path: ../.env  # API keys (see .env.example); keys entered in Settings go to data/api_keys.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
