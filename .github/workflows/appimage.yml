# Builds the AppImage (scripts/build-appimage.sh) when a release is published and attaches it
# to that release. "Run workflow" on the Actions page builds one from any branch without a
# release - the file is then an artifact of the run.
name: AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # attach the file to the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Build
        run: ./scripts/build-appimage.sh

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.AppImage --clobber

      - name: Keep as an artifact of the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Card_Scanner-AppImage
          path: dist/*.AppImage
          compression-level: 0  # already compressed
          if-no-files-found: error
